[package]
name = "idlgen"
version = "0.1.0"
edition = "2021"
description = "Builds the Anchor IDL via anchor-lang-idl (same code path as `anchor idl build`) without the CLI's toolchain management"

[workspace]

[dependencies]
anchor-lang-idl = { version = "0.1.4", features = ["build"] }
serde_json = "1"

[package]
name = "ij-replay"
version = "0.1.0"
edition = "2021"
description = "INSIDE JOB's heist replay, compiled to WebAssembly: the program's own state.rs + sim.rs + replaylog.rs, run in the browser at lights-on"
# the program's build script: the same map.txt / stations.txt -> the same compiled tables
build = "../../programs/inside-job/build.rs"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["replay"]
replay = []

[dependencies]
bytemuck = { version = "1.16", features = ["derive", "min_const_generics", "extern_crate_alloc"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
